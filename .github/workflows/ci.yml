name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Python Linting (Flake8)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8

      - name: Lint Python packages
        run: |
          flake8 src/assistant_perception/assistant_perception
          flake8 src/assistant_interaction/assistant_interaction
          flake8 src/assistant_motion/assistant_motion
          flake8 training

  build:
    name: ROS 2 Jazzy Build Validation
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-rosdep

      - name: Initialize rosdep
        run: |
          rosdep init || true
          rosdep update

      - name: Install dependencies
        working-directory: ${{ github.workspace }}
        run: |
          rosdep install --from-paths src --ignore-src -r -y

      - name: Build workspace
        working-directory: ${{ github.workspace }}
        run: |
          colcon build --event-handlers console_direct+

      - name: Verify launch file syntax
        run: |
          find src -name '*.py' -print0 | xargs -0 python3 -m py_compile

      - name: Run ROS package tests
        working-directory: ${{ github.workspace }}
        run: |
          . install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

  repo-checks:
    name: Repository Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: python3 -m pip install pytest pyyaml

      - name: Run hardware-free unit tests
        run: |
          PYTHONPATH=src/assistant_perception:src/assistant_interaction:src/assistant_motion \
            python3 -m pytest -q tests

      - name: Validate YAML config
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path('src/assistant_bringup/config').glob('*.yaml'):
              yaml.safe_load(path.read_text())
              print(f'{path} OK')
          PY

      - name: Validate object map JSON
        run: |
          python3 -c "import json; json.load(open('src/assistant_bringup/config/object_map_example.json')); print('object_map_example.json OK')"

      - name: Validate interface files exist
        run: |
          test -f src/assistant_msgs/msg/ObjectSelection.msg
          test -f src/assistant_msgs/msg/GazePoint.msg
          test -f src/assistant_msgs/msg/DetectedObject.msg
          test -f src/assistant_msgs/msg/DetectedObjectArray.msg
          test -f src/assistant_msgs/srv/ScanWorkspace.srv
          test -f src/assistant_msgs/srv/CalibrateWorkspace.srv
          test -f src/assistant_msgs/action/ExecuteGrasp.action
          echo "Interfaces present."

      - name: Validate package.xml files
        run: |
          for f in src/*/package.xml; do python3 -c "import sys; from xml.etree import ElementTree as ET; ET.parse('$f'); print('$f OK')"; done
