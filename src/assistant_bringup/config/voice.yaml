# Voice input from the phone microphone. IP Webcam (Android) serves live audio
# at http://<phone-ip>:8080/audio.wav. See docs/voice.md for the Vosk model.
# Ignored in mock mode.
voice_node:
  ros__parameters:
    voice_stream_url: ""
    vosk_model_path: "models/voice/vosk-model-small-en-us-0.15"
    voice_open_timeout_s: 5.0
    voice_chunk_ms: 200
    voice_reconnect_base_delay_s: 1.0
    voice_reconnect_max_delay_s: 30.0
