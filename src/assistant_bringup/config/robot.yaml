# Fixed-pose demo. Keep autonomous perception-driven grasping disabled.
motion_planner_node:
  ros__parameters:
    motion_enabled: false
    mock_mode: true
    detection_timeout_seconds: 1.0
    arm_command_timeout_s: 60.0
    arm_reach_min_m: 0.0
    arm_reach_max_m: 0.0
    arm_base_limit_deg: 40.0
    channel_limits:
      0: {min: 330, max: 460, center: 330}
      1: {min: 430, max: 490, center: 430}
      2: {min: 400, max: 460, center: 400}
      3: {min: 300, max: 460, center: 300}
arm_controller_node:
  ros__parameters:
    serial_port: /dev/ttyACM0
    baudrate: 115200
    mock_mode: false
    channel_limits:
      0: {min: 330, max: 460, center: 330}
      1: {min: 430, max: 490, center: 430}
      2: {min: 400, max: 460, center: 400}
      3: {min: 300, max: 460, center: 300}
