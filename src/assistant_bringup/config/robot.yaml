motion_planner_node:
  ros__parameters:
    # Real motion is refused unless this is true (and mock_mode is false).
    motion_enabled: false
    detection_timeout_seconds: 1.0
    arm_command_timeout_s: 30.0
    # Reach of the calibrated grid in firmware/arm_controller/arm_calibration.h
    # (first and last REACH_MM, in metres) and the base sweep either side of
    # straight ahead. A target outside them by more than the clamp margin is
    # refused; a slight overshoot is clamped onto the nearest safe pose.
    # The grid is still the placeholder single column at REACH_MM[0] = 0, so
    # 0.0 / 0.0 refuses every real grasp until that grid is filled in.
    arm_reach_min_m: 0.0
    arm_reach_max_m: 0.0
    arm_base_limit_deg: 40.0
    # Servo travel per PCA9685 channel in pulse counts: ch0 base, ch1 + ch2
    # coupled linkage, ch3 gripper. Same numbers as PULSE_MIN / PULSE_MAX /
    # PULSE_CENTER in arm_protocol.py and arm_calibration.h. The planner clamps
    # the base (ch0) pulse and the reach before sending; the Arduino keeps its
    # own out_of_range check as the final gate.
    channel_limits:
      0: {min: 225, max: 389, center: 307}
      1: {min: 225, max: 389, center: 307}
      2: {min: 225, max: 389, center: 307}
      3: {min: 225, max: 389, center: 307}

arm_controller_node:
  ros__parameters:
    # Pi: usually /dev/ttyACM0 (user must be in the dialout group).
    serial_port: /dev/ttyACM0
    baudrate: 115200
    # Last ROS-side clamp before the serial port; keep in step with the block
    # above. ch1/ch2/ch3 pulses come from the firmware grid, so only the ch0
    # base pulse can be clamped here.
    channel_limits:
      0: {min: 225, max: 389, center: 307}
      1: {min: 225, max: 389, center: 307}
      2: {min: 225, max: 389, center: 307}
      3: {min: 225, max: 389, center: 307}
